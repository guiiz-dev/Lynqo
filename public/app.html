<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lynqo App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: cabeçalho fixo; coluna esquerda com perfil e parceiros; coluna direita com o chat traduzido. */
:root {
  --ink:#101745; --text:#4b5174; --muted:#7b819f; --brand:#6a4df4; --brand-2:#8d75ff;
  --tint:#f1f3ff; --tint-2:#e5e8ff; --line:#e4e7f4; --green:#22c55e; --warn:#fff4d6; --warn-ink:#7a5a00;
  --font:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--tint); color:var(--text); font-family:var(--font); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:#fff; z-index:60; }
h1,h2,h3,p,ul { margin:0; } ul { padding:0; list-style:none; }
button, select, input { font:inherit; color:inherit; }
button { cursor:pointer; }
a { color:var(--brand); font-weight:600; text-decoration:none; } a:hover { text-decoration:underline; }
:focus-visible { outline:3px solid var(--brand-2); outline-offset:2px; border-radius:8px; }
.wrap { max-width:1180px; margin-inline:auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
svg.i { width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:50; background:#fff; border-bottom:1px solid #eceef8; }
.bar { display:flex; align-items:center; gap:14px; height:56px; }
.logo { display:flex; align-items:center; gap:8px; font-weight:800; font-size:22px; color:var(--ink); }
.logo svg { width:30px; height:30px; }
.pill { background:var(--warn); color:var(--warn-ink); font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; }
.bar .back { margin-left:auto; font-size:13px; }
.demo { margin-top:16px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px 14px; font-size:12.5px; display:flex; gap:10px; align-items:flex-start; }
.demo svg { color:var(--brand); font-size:16px; margin-top:2px; }
.grid { display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:18px; padding-block:16px 32px; align-items:start; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; }
h2 { font-size:15px; font-weight:800; color:var(--ink); }
.fields { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
label { display:block; font-size:11.5px; font-weight:700; color:var(--ink); margin-bottom:4px; }
select { width:100%; border:1.5px solid #cfd3e6; background:#fff; border-radius:10px; padding:9px 10px; font-size:13px; }
.chips { margin-top:12px; display:flex; flex-wrap:wrap; gap:6px; }
.chip { border:1.5px solid #d7dbee; background:#fff; border-radius:999px; padding:4px 11px; font-size:12px; font-weight:600; color:var(--ink); }
.chip[aria-pressed="true"] { background:var(--brand); border-color:var(--brand); color:#fff; }
.list-head { display:flex; justify-content:space-between; align-items:baseline; margin:18px 2px 10px; }
.list-head span { font-size:12px; color:var(--muted); }
.plist { display:grid; gap:10px; }
.p { background:#fff; border:1.5px solid var(--line); border-radius:14px; padding:12px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; text-align:left; width:100%; transition:border-color .15s, box-shadow .15s; }
.p:hover { border-color:#b9aef8; box-shadow:0 8px 20px -14px rgba(60,50,170,.5); }
.p[aria-current="true"] { border-color:var(--brand); box-shadow:0 0 0 3px rgba(106,77,244,.14); }
.avwrap { position:relative; width:52px; height:52px; }
.av { width:52px; height:52px; border-radius:50%; object-fit:cover; display:grid; place-items:center; background:var(--tint-2); color:var(--brand); font-weight:800; font-size:18px; border:1px solid var(--line); }
.avwrap .fl { position:absolute; right:-4px; bottom:-2px; width:20px; height:20px; border-radius:50%; overflow:hidden; box-shadow:0 0 0 2px #fff; }
.fl svg, svg.flag { width:100%; height:100%; display:block; border-radius:50%; }
.p b { color:var(--ink); font-size:13.5px; display:block; }
.p .pair { font-size:11.5px; color:var(--muted); }
.p .tags { margin-top:5px; display:flex; flex-wrap:wrap; gap:4px; }
.tag { background:#eef0fb; color:#646b8e; font-size:10.5px; font-weight:600; padding:1px 7px; border-radius:6px; }
.tag.hit { background:var(--tint-2); color:var(--brand); }
.match { font-size:10.5px; font-weight:700; border-radius:999px; padding:2px 9px; margin-top:5px; display:inline-block; background:#e1f7e9; color:#157a3b; }
.match.half { background:var(--tint-2); color:var(--brand); }
.on { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:var(--ink); }
.on::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--green); }
.empty { background:#fff; border:1.5px dashed #cfd3e6; border-radius:14px; padding:22px; text-align:center; font-size:13px; }

.chat { position:sticky; top:calc(72px + env(safe-area-inset-top,0px)); height:calc(100vh - 100px); min-height:460px; max-height:760px; display:flex; flex-direction:column; padding:0; overflow:hidden; }
.chat-head { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
.chat-head .av { width:40px; height:40px; font-size:15px; }
.chat-head .ttl { min-width:0; } .chat-head b { color:var(--ink); display:block; }
.chat-head small { color:var(--muted); font-size:11.5px; }
.sw { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; color:var(--ink); }
.sw button { width:36px; height:20px; border-radius:999px; border:0; background:#cfd3e6; position:relative; padding:0; }
.sw button::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .15s; }
.sw button[aria-pressed="true"] { background:var(--brand); } .sw button[aria-pressed="true"]::after { transform:translateX(16px); }
.close { display:none; border:0; background:var(--tint); width:34px; height:34px; border-radius:50%; font-size:16px; }
.msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; background:var(--tint); }
.hint { margin:auto; text-align:center; max-width:300px; color:var(--muted); font-size:13px; }
.hint svg { font-size:28px; color:var(--brand); margin-bottom:6px; }
.m { max-width:84%; background:#fff; border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:8px 12px; color:var(--ink); font-size:13.5px; overflow-wrap:anywhere; }
.m.me { align-self:flex-end; background:var(--brand); border-color:var(--brand); color:#fff; border-radius:14px 14px 4px 14px; }
.m small { display:block; margin-top:4px; font-size:11px; opacity:.75; }
.sys { align-self:center; font-size:12px; color:var(--warn-ink); background:var(--warn); border-radius:10px; padding:6px 12px; text-align:center; }
.typing { align-self:flex-start; font-size:12px; color:var(--muted); }
.send { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:#fff; flex-wrap:wrap; }
.send input { flex:1 1 200px; min-width:0; border:1.5px solid #cfd3e6; border-radius:999px; padding:10px 14px; }
.btn { border:0; border-radius:999px; background:var(--brand); color:#fff; font-weight:700; padding:10px 18px; display:inline-flex; align-items:center; gap:8px; }
.btn:disabled, .send input:disabled { opacity:.55; cursor:not-allowed; }
.btn.ghost { background:#fff; color:var(--brand); border:1.5px solid #b9aef8; padding:6px 12px; font-size:12px; }
.send .row { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--muted); }
.noteline { font-size:11px; }

@media (max-width:900px) {
  .grid { grid-template-columns:1fr; }
  .chat { display:none; position:fixed; inset:0; z-index:80; max-height:none; height:auto; border-radius:0; top:0; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  .chat.open { display:flex; }
  .close { display:block; }
  .sw span { display:none; }
}
@media (max-width:480px) { .fields { grid-template-columns:1fr; } .p { grid-template-columns:auto 1fr; } .p .go { grid-column:1 / -1; } }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<header class="top"><div class="wrap bar">
  <span class="logo"><svg viewBox="0 0 36 36" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d75ff"/><stop offset="1" stop-color="#5a3df0"/></linearGradient></defs><path d="M5 8a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v11a2 2 0 0 0 2 2h8a5 5 0 0 1 5 5v1a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5z" fill="url(#lg)"/><circle cx="27" cy="9" r="4" fill="#9ab8ff"/></svg>Lynqo</span>
  <span class="pill">Protótipo</span>
  <a class="back" href="/">Página inicial</a>
</div></header>

<main class="wrap">
  <div class="demo"><svg class="i"><use href="#g-globe"/></svg><p><b>Versão de demonstração.</b> Os perfis são fictícios e as respostas são simuladas. A tradução automática é feita por IA (Claude).</p></div>
  <div class="grid">
    <section aria-label="Encontrar parceiros">
      <div class="card">
        <h2>Seu perfil</h2>
        <div class="fields">
          <div><label for="my">Eu falo</label><select id="my"></select></div>
          <div><label for="want">Quero aprender</label><select id="want"></select></div>
        </div>
        <div class="chips" id="interests" role="group" aria-label="Seus interesses"></div>
      </div>
      <div class="list-head"><h2 id="count">Parceiros</h2><span>Ordenados por compatibilidade</span></div>
      <div class="plist" id="plist"></div>
    </section>

    <section class="card chat" id="chat" aria-label="Conversa">
      <div class="chat-head" id="chead"></div>
      <div class="msgs" id="msgs" role="log" aria-live="polite"></div>
      <form class="send" id="form" autocomplete="off">
        <input id="inp" type="text" maxlength="400" aria-label="Mensagem" disabled>
        <button class="btn" id="sendbtn" type="submit" disabled>Enviar<svg class="i"><use href="#g-arrow"/></svg></button>
        <div class="row"><span class="noteline" id="note"></span><button type="button" class="btn ghost" id="hi" hidden>Dizer olá</button></div>
      </form>
    </section>
  </div>
</main>

    st.busy = false; $('sendbtn').disabled = false; renderMsgs();
  });
  renderList(); renderMsgs();
})();
</script>
